name: alfa-psb
services:
  assistant:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-${OPENAI_BASE_URL:-}}"
      LLM_API_KEY: "${LLM_API_KEY:-${OPENAI_API_KEY:-}}"
      LLM_MODEL: "${LLM_MODEL:-${GEN_MODEL:-}}"
      EMB_MODEL: "${EMB_MODEL:-baai/bge-m3}"
      RERANKER_MODEL: "${RERANKER_MODEL:-}"
      EMBEDDER_API_KEY: "${EMBEDDER_API_KEY:-}"
      RERANKER_API_KEY: "${RERANKER_API_KEY:-}"
      MAX_TOKENS: "${MAX_TOKENS:-1500}"
      MAX_WORKERS: "${MAX_WORKERS:-2}"
      TEMPERATURE: "${TEMPERATURE:-0}"
      TOP_K: "${TOP_K:-18}"
      RERANKER_TOP_N: "${RERANKER_TOP_N:-10}"
      LLM_JSON_MODE: "${LLM_JSON_MODE:-1}"
      LLM_THINKING: "${LLM_THINKING:-auto}"
      RAG_RETRY_SEARCH: "${RAG_RETRY_SEARCH:-1}"
      OFFLINE: "${OFFLINE:-0}"
      PSB_WEB_DIAGNOSTICS: "${PSB_WEB_DIAGNOSTICS:-0}"
      DATA_DIR: "${DATA_DIR:-data}"
